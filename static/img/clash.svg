<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g fill="#1572D3" stroke="#1572D3">
    
    <!-- 
      精准身材比例：
      底宽 94 (X: 53 到 147)，顶部耳宽 64 (X: 68 到 132)
      彻底解决太胖和太瘦的问题
    -->
    <path d="M 53 155 
             Q 100 160 147 155 
             L 132 50 
             L 112 75 
             Q 100 82 88 75 
             L 68 50 Z" 
          stroke-width="8" stroke-linejoin="round"/>
          
    <!-- 尾巴：紧贴身体，弧度卡准 -->
    <path d="M 54 140 C 5 155, 10 100, 35 110" 
          fill="none" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- 眼睛：居中对齐，大小还原 -->
  <circle cx="78" cy="92" r="6" fill="#FFFFFF"/>
  <circle cx="122" cy="92" r="6" fill="#FFFFFF"/>
  
  <!-- 嘴巴：精确居中 -->
  <path d="M 94 104 Q 97 108 100 104 Q 103 108 106 104" 
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
